# Cloudflare Pages configuration
# This file is used for Cloudflare Pages Functions, not for direct deployment
# The main deployment is handled through Cloudflare Pages dashboard

name = "shiratsumu"
compatibility_date = "2024-01-01"

# Pages-specific configuration
[env.production.vars]
ENVIRONMENT = "production"

[env.preview.vars]
ENVIRONMENT = "preview"

# Note: Environment variables should be set in Cloudflare Pages dashboard:
# - UNSPLASH_KEY: Your Unsplash API key
# - FIREBASE_* variables if using Firebase