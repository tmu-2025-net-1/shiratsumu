name = "shiratsumu"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Pages-specific configuration
[env.production.vars]
ENVIRONMENT = "production"

[env.preview.vars]
ENVIRONMENT = "preview"

# Note: Environment variables should be set in Cloudflare Pages dashboard:
# - UNSPLASH_KEY: Your Unsplash API key
# - FIREBASE_* variables if using Firebase
